---
# List of all hooks: https://pre-commit.com/hooks.html
repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: cli/tests/example_local_workflow.ipynb
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-json
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
#        exclude: (\.dat)|(\.vcxproj(\.filters)?)|(\.targets)$
      - id: fix-byte-order-marker
      - id: mixed-line-ending
#      - id: no-commit-to-branch
#        args: [--branch, master]
      - id: trailing-whitespace
  - repo: https://github.com/syntaqx/git-hooks
    rev: v0.0.18
    hooks:
      - id: forbid-binary
        exclude: ^data/audio/.*\.mp3$|__pycache__/
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: text-unicode-replacement-char
  - repo: https://github.com/PyCQA/bandit  # Linter for security issues
    rev: 1.8.6
    hooks:
      - id: bandit
        args:
          - --skip
          - B101
          - --severity-level
          - high
          - --confidence-level
          - medium
  - repo: https://github.com/codespell-project/codespell  # Common misspellings
    rev: v2.4.1
    hooks:
      - id: codespell
        files: \.(md|rst|adoc)$
        args:
          - -L
          - thirdparty
          - --write-changes
          - --ignore-words=codespell_exceptions.txt
  - repo: https://github.com/crate-ci/typos
    rev: v1
    hooks:
      - id: typos
        name: typos verbose
        verbose: true
        files: \.(md|rst|adoc)$
        args: [--verbose]
      - id: typos
        name: typos write changes
        verbose: true
        files: \.(md|rst|adoc)$
        args: [--write-changes]

  # Justfile hooks
  - repo: local
    hooks:
      - id: format-justfiles
        name: Format justfiles
        entry: bash -c 'just --justfile "$1" --dump > "$1.formatted" && mv "$1.formatted"
          "$1"' --
        files: ((^|/)justfile$)|(.*\.justfile$)
        language: system
        pass_filenames: true

  # Python hooks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.9
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.404
    hooks:
      - id: pyright
        name: pyRight checks
        args: [--pythonpath, rabbit_engine/.venv/bin/python]

  # YAML
  - repo: https://github.com/lyz-code/yamlfix  # Formatter
    rev: 1.17.0
    hooks:
      - id: yamlfix
        exclude: ^\.gitlab-ci\.yml$
  - repo: https://github.com/adrienverge/yamllint  # Linter
    rev: v1.37.1
    hooks:
      - id: yamllint
        exclude: ^\.gitlab-ci\.yml$

    # .gitignore
  - repo: https://github.com/lorenzwalthert/gitignore-tidy  # Formatter
    rev: 0.1.2
    hooks:
      - id: tidy-gitignore
        args: [--allow-leading-whitespace]
        exclude: ^\.gitignore$  # Ignoring the main .gitignore file for now.
        # Without comments this will re-shuffle the order of all the entries.

  # Unit tests
  - repo: local
    hooks:
      - id: pytest
        name: pyTests
        entry: bash -c '.venv/bin/coverage  run --source .  --omit='tests/*'  -m pytest
          -W error::RuntimeWarning && .venv/bin/coverage report -m'
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
